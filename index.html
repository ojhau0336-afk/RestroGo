<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>RestroGo — Order Food</title>
  <link rel="stylesheet" href="style.css"/>
</head>
<body>

<!-- ── HEADER ── -->
<header class="cust-header">
  <div class="cust-header-inner">
    <div class="rg-logo">
      <div class="rg-logo-mark">R</div>
      <span class="rg-logo-text">Restro<span>Go</span></span>
    </div>
    <span class="header-table-badge" id="tableBadge">Table —</span>
    <button class="cart-fab" id="cartFab" onclick="openCart()">
      🛒 Cart
      <span class="cart-count hidden" id="cartCount">0</span>
    </button>
  </div>
</header>

<!-- ── BANNER ── -->
<div class="cust-banner" id="mainBanner">
  <h1>🍽️ Welcome to Spice Garden</h1>
  <p>Authentic Indian Cuisine — Scan. Order. Enjoy!</p>
</div>

<!-- ── SEARCH & CATEGORIES ── -->
<div class="search-filter" id="menuArea">
  <div class="search-box">
    <svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
    <input type="text" id="searchInput" placeholder="Search food items…" oninput="filterMenu()"/>
  </div>
  <div class="cat-tabs" id="catTabs">
    <button class="cat-tab active" data-cat="All"         onclick="selectCat(this)">🍽 All</button>
    <button class="cat-tab"        data-cat="Starters"    onclick="selectCat(this)">🥗 Starters</button>
    <button class="cat-tab"        data-cat="Main Course" onclick="selectCat(this)">🍛 Main Course</button>
    <button class="cat-tab"        data-cat="Biryani"     onclick="selectCat(this)">🍚 Biryani</button>
    <button class="cat-tab"        data-cat="Beverages"   onclick="selectCat(this)">🥤 Beverages</button>
    <button class="cat-tab"        data-cat="Desserts"    onclick="selectCat(this)">🍮 Desserts</button>
  </div>
</div>

<!-- ── MENU GRID ── -->
<div class="menu-grid" id="menuGrid"></div>

<!-- ── CHECKOUT SECTION ── -->
<div class="checkout-section hidden" id="checkoutSection">
  <div class="checkout-card">
    <h2>📋 Place Your Order</h2>
    <div class="order-summary-mini" id="checkoutSummary"></div>
    <div class="form-group">
      <label>Your Name *</label>
      <input type="text" id="custName" placeholder="e.g. Rahul Sharma"/>
      <span class="field-err hidden" id="nameErr">Please enter your name.</span>
    </div>
    <div class="form-group">
      <label>Special Instructions (optional)</label>
      <textarea id="custNotes" rows="3" placeholder="Less spicy, no onion…"></textarea>
    </div>
    <div class="form-group">
      <label>Table Number</label>
      <input type="text" id="custTable" readonly style="background:#f5f5f5;"/>
    </div>
    <button class="btn btn-primary w100" style="border-radius:12px;padding:14px;" onclick="placeOrder()">
      🛍 Place Order
    </button>
    <button class="btn btn-outline w100 mt8" style="border-radius:12px;padding:12px;" onclick="showMenu()">
      ← Back to Menu
    </button>
  </div>
</div>

<!-- ── CONFIRMATION PAGE ── -->
<div class="confirm-page hidden" id="confirmPage">
  <div class="confirm-icon">🎉</div>
  <h2>Order Placed!</h2>
  <p>Your order has been sent to the kitchen. We'll prepare it right away!</p>
  <div class="order-id-box">
    <div class="label">Order ID</div>
    <div class="val" id="confirmOrderId">—</div>
  </div>
  <div class="tracking-card" id="trackingCard">
    <h4>🔄 Order Status</h4>
    <div class="track-steps" id="trackSteps"></div>
  </div>
  <button class="btn btn-primary mt24" onclick="showMenu()">Order More Food</button>
</div>

<!-- ── CART DRAWER ── -->
<div class="cart-overlay" id="cartOverlay" onclick="closeCart()"></div>
<div class="cart-drawer" id="cartDrawer">
  <div class="cart-header">
    <h3>🛒 Your Cart</h3>
    <button class="cart-close" onclick="closeCart()">✕</button>
  </div>
  <div class="cart-items" id="cartItems"></div>
  <div class="cart-footer" id="cartFooter">
    <div class="cart-total">
      <span class="label">Total</span>
      <span class="amount" id="cartTotal">₹0</span>
    </div>
    <button class="btn btn-primary w100" style="border-radius:12px;padding:13px;" onclick="goToCheckout()">
      Proceed to Order →
    </button>
  </div>
</div>

<!-- ── TOAST ── -->
<div class="toast-container" id="toastContainer"></div>

<script src="data.js"></script>
<script>
/* ════════ CUSTOMER APP ════════ */
RG.seed();
RG.initChannel();

let cart       = {};   // { menuId: qty }
let activeCat  = 'All';
let tableNo    = '';
let currentOrderId = null;
let trackInterval  = null;

// ── Init ──
(function init() {
  const params = new URLSearchParams(location.search);
  tableNo = params.get('table') || 'Walk-in';
  document.getElementById('tableBadge').textContent = tableNo !== 'Walk-in' ? `Table ${tableNo}` : 'Walk-in';
  document.getElementById('custTable').value = tableNo !== 'Walk-in' ? `Table ${tableNo}` : 'Walk-in';
  renderMenu();

  // Cross-tab menu updates
  if (RG.ch) {
    RG.ch.onmessage = e => {
      if (e.data.type === 'MENU_UPDATED') renderMenu();
      if (e.data.type === 'ORDERS_UPDATED' && currentOrderId) updateTracking();
      if (e.data.type === 'RESET') { cart = {}; renderMenu(); updateCartUI(); showMenu(); }
    };
  }
  window.addEventListener('storage', e => {
    if (e.key === RG.KEYS.MENU)   renderMenu();
    if (e.key === RG.KEYS.ORDERS && currentOrderId) updateTracking();
  });
})();

// ── Render menu ──
function renderMenu() {
  const menu  = RG.getMenu().filter(i => i.enabled);
  const query = (document.getElementById('searchInput')?.value || '').toLowerCase();
  const grid  = document.getElementById('menuGrid');

  let items = menu.filter(i =>
    (activeCat === 'All' || i.cat === activeCat) &&
    (i.name.toLowerCase().includes(query) || i.desc.toLowerCase().includes(query))
  );

  if (!items.length) {
    grid.innerHTML = `<div class="empty-state" style="grid-column:1/-1">
      <div class="es-icon">🍽️</div>
      <h3>No items found</h3>
      <p class="muted">Try a different category or search term.</p>
    </div>`;
    return;
  }

  grid.innerHTML = items.map(item => {
    const qty = cart[item.id] || 0;
    return `
    <div class="food-card ${item.enabled?'':'disabled'}" id="card-${item.id}">
      <div class="food-img"><img src="${item.img}" alt="${item.name}" loading="lazy" onerror="this.src='https://images.unsplash.com/photo-1546069901-ba9599a7e63c?w=400'"/></div>
      <div class="food-body">
        <div class="food-name">${item.name}</div>
        <div class="food-desc">${item.desc}</div>
        <div class="food-footer">
          <span class="food-price">${RG.fmt.price(item.price)}</span>
          ${qty === 0
            ? `<button class="add-btn" onclick="addToCart('${item.id}')">Add +</button>`
            : `<div class="qty-ctrl">
                <button onclick="decCart('${item.id}')">−</button>
                <span id="qty-${item.id}">${qty}</span>
                <button onclick="incCart('${item.id}')">+</button>
               </div>`
          }
        </div>
      </div>
    </div>`;
  }).join('');
}

function selectCat(el) {
  document.querySelectorAll('.cat-tab').forEach(t => t.classList.remove('active'));
  el.classList.add('active');
  activeCat = el.dataset.cat;
  filterMenu();
}

function filterMenu() { renderMenu(); }

// ── Cart ──
function addToCart(id) {
  cart[id] = 1;
  updateCartUI();
  renderMenu();
  toast('Added to cart! 🛒');
}
function incCart(id) {
  cart[id] = (cart[id] || 0) + 1;
  updateCartUI();
  document.getElementById('qty-' + id).textContent = cart[id];
}
function decCart(id) {
  cart[id] = (cart[id] || 1) - 1;
  if (cart[id] <= 0) { delete cart[id]; renderMenu(); }
  else document.getElementById('qty-' + id).textContent = cart[id];
  updateCartUI();
}

function updateCartUI() {
  const menu   = RG.getMenu();
  const keys   = Object.keys(cart);
  const count  = keys.reduce((s, id) => s + cart[id], 0);
  const total  = keys.reduce((s, id) => {
    const item = menu.find(m => m.id === id);
    return s + (item ? item.price * cart[id] : 0);
  }, 0);

  const countEl = document.getElementById('cartCount');
  countEl.textContent = count;
  countEl.classList.toggle('hidden', count === 0);
  document.getElementById('cartTotal').textContent = RG.fmt.price(total);

  renderCartItems(menu, keys, total);
}

function renderCartItems(menu, keys, total) {
  const el = document.getElementById('cartItems');
  if (!keys.length) {
    el.innerHTML = `<div class="cart-empty"><div class="es-icon">🛒</div><p class="muted">Your cart is empty.<br/>Add some delicious items!</p></div>`;
    document.getElementById('cartFooter').style.display = 'none';
    return;
  }
  document.getElementById('cartFooter').style.display = '';
  el.innerHTML = keys.map(id => {
    const item = menu.find(m => m.id === id);
    if (!item) return '';
    return `
    <div class="cart-item">
      <div class="cart-item-img"><img src="${item.img}" alt="${item.name}" onerror="this.src='https://images.unsplash.com/photo-1546069901-ba9599a7e63c?w=400'"/></div>
      <div class="cart-item-info">
        <div class="cart-item-name">${item.name}</div>
        <div class="cart-item-price">${RG.fmt.price(item.price)} × ${cart[id]}</div>
      </div>
      <div class="qty-ctrl">
        <button onclick="decCart('${id}')">−</button>
        <span>${cart[id]}</span>
        <button onclick="incCart('${id}')">+</button>
      </div>
    </div>`;
  }).join('');
}

function openCart()  { document.getElementById('cartDrawer').classList.add('open'); document.getElementById('cartOverlay').classList.add('open'); }
function closeCart() { document.getElementById('cartDrawer').classList.remove('open'); document.getElementById('cartOverlay').classList.remove('open'); }

// ── Checkout ──
function goToCheckout() {
  if (!Object.keys(cart).length) { toast('Cart is empty!', 'error'); return; }
  closeCart();
  buildCheckoutSummary();
  document.getElementById('mainBanner').classList.add('hidden');
  document.getElementById('menuArea').classList.add('hidden');
  document.getElementById('menuGrid').classList.add('hidden');
  document.getElementById('checkoutSection').classList.remove('hidden');
  document.getElementById('confirmPage').classList.add('hidden');
  window.scrollTo(0, 0);
}

function buildCheckoutSummary() {
  const menu  = RG.getMenu();
  const keys  = Object.keys(cart);
  const total = keys.reduce((s,id) => { const m = menu.find(x=>x.id===id); return s+(m?m.price*cart[id]:0); }, 0);
  const rows  = keys.map(id => {
    const m = menu.find(x=>x.id===id);
    if (!m) return '';
    return `<div class="row"><span>${m.name} × ${cart[id]}</span><span>${RG.fmt.price(m.price*cart[id])}</span></div>`;
  }).join('');
  document.getElementById('checkoutSummary').innerHTML = rows +
    `<div class="row total"><span>Total</span><span>${RG.fmt.price(total)}</span></div>`;
}

function placeOrder() {
  const name  = document.getElementById('custName').value.trim();
  const notes = document.getElementById('custNotes').value.trim();
  const nameErr = document.getElementById('nameErr');

  document.getElementById('custName').classList.remove('err');
  nameErr.classList.add('hidden');

  if (!name) {
    document.getElementById('custName').classList.add('err');
    nameErr.classList.remove('hidden');
    return;
  }

  const menu  = RG.getMenu();
  const items = Object.keys(cart).map(id => {
    const m = menu.find(x => x.id === id);
    return { id, name:m.name, price:m.price, qty:cart[id] };
  });
  const total = items.reduce((s,i) => s + i.price * i.qty, 0);

  const order = {
    id:           RG.newOrderId(),
    table:        tableNo,
    customer:     name,
    instructions: notes,
    items,
    total,
    status:       'placed',
    createdAt:    Date.now(),
    updatedAt:    Date.now(),
  };

  RG.addOrder(order);
  currentOrderId = order.id;
  cart = {};
  updateCartUI();

  document.getElementById('confirmOrderId').textContent = order.id;
  document.getElementById('checkoutSection').classList.add('hidden');
  document.getElementById('confirmPage').classList.remove('hidden');
  window.scrollTo(0, 0);

  updateTracking();
  if (trackInterval) clearInterval(trackInterval);
  trackInterval = setInterval(updateTracking, 5000);
  toast('Order placed successfully! 🎉', 'success');
}

function updateTracking() {
  if (!currentOrderId) return;
  const order = RG.getOrder(currentOrderId);
  if (!order) return;

  const steps = [
    { key:'placed',    label:'Order Placed',  icon:'✅' },
    { key:'preparing', label:'Preparing',     icon:'👨‍🍳' },
    { key:'ready',     label:'Ready to Serve',icon:'🔔' },
    { key:'delivered', label:'Delivered',     icon:'🎉' },
  ];
  const statusOrder = ['placed','preparing','ready','delivered'];
  const curIdx = statusOrder.indexOf(order.status);

  document.getElementById('trackSteps').innerHTML = steps.map((s, i) => {
    const done   = i < curIdx;
    const active = i === curIdx;
    return `
    <div class="track-step ${done?'done':''} ${active?'active':''}">
      <div class="step-dot">${done ? '✓' : (active ? s.icon : (i+1))}</div>
      <div class="step-info">
        <strong>${s.label}</strong>
        <span>${done || active ? RG.fmt.ago(order.updatedAt) : 'Waiting…'}</span>
      </div>
    </div>`;
  }).join('');

  if (order.status === 'delivered') {
    clearInterval(trackInterval);
    toast('Your order has been delivered! Enjoy 🍽️', 'success');
  }
}

function showMenu() {
  document.getElementById('mainBanner').classList.remove('hidden');
  document.getElementById('menuArea').classList.remove('hidden');
  document.getElementById('menuGrid').classList.remove('hidden');
  document.getElementById('checkoutSection').classList.add('hidden');
  document.getElementById('confirmPage').classList.add('hidden');
  renderMenu();
  window.scrollTo(0, 0);
}

// ── Toast ──
function toast(msg, type='') {
  const el = document.createElement('div');
  el.className = `toast ${type}`;
  el.textContent = msg;
  document.getElementById('toastContainer').appendChild(el);
  setTimeout(() => el.remove(), 3500);
}

updateCartUI();
</script>
</body>
</html>
